; Bambutton ESP32 — plate-clear button for Bambuddy
; Builds a single firmware.bin that can be flashed from the browser.

[env:esp32-c3-super-mini]
platform         = espressif32@6.13.0
board            = esp32-c3-devkitm-1
framework        = arduino
monitor_speed    = 115200
upload_speed     = 921600

; ESP32-C3 Super Mini uses the native USB-Serial/JTAG port, so route
; Serial over USB CDC and keep it enabled from boot.
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=0

lib_deps =
    bblanchon/ArduinoJson@7.4.3

board_build.partitions = min_spiffs.csv
